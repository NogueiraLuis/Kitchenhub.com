<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/receitas-themes.css" />
    <link rel="stylesheet" href="/static/css/toast.css" />
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>KitchenHub - Suas Receitas Favoritas</title>
  </head>
  <body>
    <div id="toast-container" class="toast-container"></div>

    <main id="main-content">
      <nav id="header" class="main-header">
        <div class="logo-container">
          <img src="/assets/logo.png" alt="Logo KitchenHub" />
          <h1 class="brand-name">
            KitchenHub<span id="nome-usuario-topo"></span>
          </h1>
        </div>

        <div class="menu-wrapper">
          <button
            class="menu-toggle"
            id="btn-menu"
            aria-label="Abrir menu de navegação"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <nav class="side-menu" id="menu-lateral" aria-label="Menu Principal">
            <button class="btn-close" id="btn-fechar" aria-label="Fechar menu">
              &times;
            </button>
            <ul class="nav-links">
              <li><a href="sessoes.html">Sessões</a></li>
              <li><a href="login.html">Login</a></li>
              <li><a href="index.html">Menu Principal</a></li>
              <li><a href="iachat.html">ChefI</a></li>
              <li>
                <a href="salvos.html"
                  >Livro de Receitas
                  <i class="fa fa-bookmark" aria-hidden="true"></i
                ></a>
              </li>
              <li>
                <a href="#" onclick="fazerLogout()" style="color: #e74c3c"
                  >Sair <i class="fa-solid fa-right-from-bracket"></i
                ></a>
              </li>
            </ul>
          </nav>
        </div>
      </nav>

      <section class="search-section" aria-labelledby="title-theme">
        <h2 id="title-theme" class="section-title">Título da Categoria</h2>

        <div class="search-container">
          <input
            id="search-recipe"
            type="text"
            placeholder="Busque a receita aqui!"
            aria-label="Campo de busca de receitas"
          />
        </div>
      </section>

      <section class="recipe-grid" id="recipe-grid"></section>
    </main>

    <div id="modal-login" class="modal-container" style="display: none">
      <div class="modal-conteudo">
        <i
          class="fa-solid fa-circle-exclamation"
          style="font-size: 3rem; color: #f39c12"
        ></i>
        <h2>Atenção!</h2>
        <p>
          Para salvar receitas no seu livro personalizado, você precisa estar
          conectado.
        </p>
        <div class="modal-botoes">
          <button onclick="fecharModal()" class="btn-cancelar">
            Agora não
          </button>
          <button onclick="irParaLogin()" class="btn-confirmar">
            Fazer Login
          </button>
        </div>
      </div>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/menuhamb.js"></script>
    <script src="/static/js/theme.js"></script>
  </body>
</html>
