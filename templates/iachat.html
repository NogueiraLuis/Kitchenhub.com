<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/iachat.css" />
    <link rel="stylesheet" href="/static/css/toast.css" />
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>KitchenHub - Chef IA</title>
  </head>
  <body>
    <div id="toast-container" class="toast-container"></div>

    <nav class="side-menu" id="menu-lateral" aria-label="Menu Principal">
      <button class="btn-close" id="btn-fechar" aria-label="Fechar menu">
        &times;
      </button>
      <ul class="nav-links">
        <li><a href="sessoes.html">Sessões</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="index.html">Menu Principal</a></li>
        <li><a href="iachat.html">ChefIA</a></li>
        <li>
          <a href="salvos.html"
            >Livro de Receitas <i class="fa fa-bookmark" aria-hidden="true"></i
          ></a>
        </li>
        <li>
          <a href="#" onclick="fazerLogout()" style="color: #e74c3c"
            >Sair <i class="fa-solid fa-right-from-bracket"></i
          ></a>
        </li>
      </ul>
    </nav>

    <div class="conteudo-principal">
      <header id="header" class="main-header">
        <button
          class="menu-toggle"
          id="btn-menu"
          aria-label="Abrir menu de navegação"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="logo-container">
          <img src="/assets/logo.png" alt="Logo KitchenHub" />
          <h1 class="brand-name">KitchenHub | IA</h1>
        </div>
      </header>

      <main>
        <div class="chat-messages" id="chat-messages">
          <div class="mensagem bot">
            Olá! Sou o assistente do KitchenHub. Como posso te ajudar na sua
            receita hoje? 👩‍🍳
          </div>
        </div>

        <section>
          <input
            id="msg"
            class="entrada"
            placeholder="Digite sua pergunta..."
          />
          <button class="botao" onclick="enviar()">Enviar</button>
        </section>
      </main>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/menuhamb.js"></script>

    <script>
      const chat = document.getElementById("chat-messages");
      const input = document.getElementById("msg");

      window.onload = async function () {
        console.log("Acordando o servidor de IA em segundo plano...");
        try {
          await fetch(
            "https://kitchenhubcom-production.up.railway.app/api/health-ollama",
          );
          console.log("Servidor de IA alertado com sucesso.");
        } catch (e) {
          console.log("Erro ao tentar acordar a IA em segundo plano:", e);
        }
      };

      input.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          enviar();
        }
      });

      function adicionarMensagem(texto, tipo) {
        const msg = document.createElement("div");
        msg.classList.add("mensagem", tipo);
        msg.innerText = texto;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      async function enviar() {
        const texto = input.value;
        if (texto.trim() === "") return;

        adicionarMensagem(texto, "usuario");
        input.value = "";

        const pensando = document.createElement("div");
        pensando.classList.add("mensagem", "bot");
        pensando.innerText = "🍳 Pensando...";
        chat.appendChild(pensando);
        chat.scrollTop = chat.scrollHeight;

        try {
          const res = await fetch(
            "https://kitchenhubcom-production.up.railway.app/api/chat",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                texto: texto,
                usuario_id: localStorage.getItem("usuario_id") || "anonimo", // Envia o ID para o Python saber quem é quem!
              }),
            },
          );

          const data = await res.json();

          if (data.sucesso) {
            let textoFormatado = data.resposta
              .replace(/\n/g, "<br>")
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            pensando.innerHTML = textoFormatado;
          } else {
            pensando.innerText = data.erro;
          }
        } catch (erro) {
          pensando.innerText =
            "Erro ao conectar ao servidor. Tente novamente em instantes!";
          console.log(erro);
        }
        chat.scrollTop = chat.scrollHeight;
      }

      function fazerLogout() {
        localStorage.removeItem("usuario_id");
        localStorage.removeItem("emailUsuarioLogado");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
