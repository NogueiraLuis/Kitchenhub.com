<!doctype html>
<html>
  <head>
    <title>Chat de Receitas</title>
    <link rel="stylesheet" href="/static/css/iachat.css" />
  </head>
  <body>
    <header>
      <h2>ChefIA 👩‍🍳</h2>
    </header>

    <main>
      <div class="chat-messages" id="chat-messages">
        <div class="mensagem bot">
          Olá! Como posso te ajudar na sua receita hoje? 👩‍🍳
        </div>
      </div>

      <section>
        <input id="msg" class="entrada" placeholder="Digite sua pergunta" />
        <button class="botao" onclick="enviar()">Enviar</button>
      </section>
    </main>

    <script>
      const chat = document.getElementById("chat-messages");
      const input = document.getElementById("msg");

      // --- Acorda a IA assim que a página entra na tela ---
      window.onload = async function () {
        console.log("Acordando o servidor de IA em segundo plano...");
        try {
          await fetch(
            "https://kitchenhubcom-production.up.railway.app/api/health-ollama",
          );
          console.log("Servidor de IA alertado com sucesso.");
        } catch (e) {
          console.log("Erro ao tentar acordar a IA em segundo plano:", e);
        }
      };

      /* ENTER para enviar */
      input.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          enviar();
        }
      });

      function adicionarMensagem(texto, tipo) {
        const msg = document.createElement("div");
        msg.classList.add("mensagem", tipo);
        msg.innerText = texto;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      async function enviar() {
        const texto = input.value;

        if (texto.trim() === "") {
          return;
        }

        /* 1. Adiciona a mensagem do usuário na tela */
        adicionarMensagem(texto, "usuario");
        input.value = "";

        /* 2. Cria e adiciona a mensagem temporária de carregamento do bot */
        const pensando = document.createElement("div");
        pensando.classList.add("mensagem", "bot");
        pensando.innerText =
          "🍳 Pensando... (Se for a primeira mensagem, o Chef pode demorar até 1 minutinho para aquecer o fogão)";
        chat.appendChild(pensando);
        chat.scrollTop = chat.scrollHeight;

        try {
          /* 3. Faz a requisição para o seu back-end no Railway */
          const res = await fetch(
            "https://kitchenhubcom-production.up.railway.app/api/chat",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                texto: texto,
              }),
            },
          );

          const data = await res.json();

          /* 4. Trata a resposta substituindo o texto do elemento "pensando" */
          if (data.sucesso) {
            // Substitui as quebras de linha por <br> e os asteriscos ** por <strong>
            let textoFormatado = data.resposta
              .replace(/\n/g, "<br>")
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>"); // Corrigido aqui!
            pensando.innerHTML = textoFormatado;
          } else {
            pensando.innerText = "Erro: " + data.erro;
          }
        } catch (erro) {
          pensando.innerText =
            "Erro ao conectar ao servidor. Tente novamente em instantes!";
          console.log(erro);
        }

        /* 5. Garante que o scroll desça após a resposta chegar */
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
